name: Privacy policy Pages

on:
  push:
    branches: [main]
    paths:
      - 'privacy-site/**'
      - 'scripts/verify-privacy.cjs'
      - 'scripts/validate-privacy-html.py'
      - 'docs/privacy/release-review.json'
      - '.github/workflows/privacy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'privacy-site/**'
      - 'scripts/verify-privacy.cjs'
      - 'scripts/validate-privacy-html.py'
      - 'docs/privacy/release-review.json'
      - '.github/workflows/privacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate public file allowlist and bilingual links
        run: node scripts/verify-privacy.cjs
      - name: Validate HTML structure
        run: python3 scripts/validate-privacy-html.py

  package:
    if: github.repository == 'mahmoudjaber11222-alt/global-islam-app' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse unresolved policy facts or incomplete review
        run: node scripts/verify-privacy.cjs --release
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only the reviewed static privacy directory
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: privacy-site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact validated revision
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
